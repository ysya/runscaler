name: Add GitHub CLI to Fail-Closed Runner

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the verified image to GHCR
        type: boolean
        default: false

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/actions-runner-local-cache
  TAG: gh-cli-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
  DOCKER_BUILD_RECORD_UPLOAD: 'false'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
        with:
          cache-binary: false
      - name: Build and load the image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: images/actions-runner
          file: images/actions-runner/Dockerfile.github-cli
          platforms: linux/amd64
          load: true
          tags: local-runner-github-cli:check
      - name: Check CLI and local cache contract
        run: |
          docker run --rm --entrypoint gh local-runner-github-cli:check --version
          docker run --rm --entrypoint /usr/local/bin/runner-local-cache-check \
            -e CUSTOM_ACTIONS_RESULTS_URL=http://offline-cache.invalid:9/ \
            local-runner-github-cli:check

  publish:
    needs: validate
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
        with:
          cache-binary: false
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: images/actions-runner
          file: images/actions-runner/Dockerfile.github-cli
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}:${{ env.TAG }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            io.runscaler.local-actions-cache.protocol=v2
            io.runscaler.local-actions-cache.runner-source=3efdc9c0d8a5b7a441cba3069b0fdc33d1931adb
            io.runscaler.local-actions-cache.legacy-v1=local-reject
          provenance: mode=max
      - name: Attest image digest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - name: Record pinned image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          printf 'Runner image: `%s@%s`\n' "$IMAGE" "$DIGEST" >> "$GITHUB_STEP_SUMMARY"
