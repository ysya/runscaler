name: Build Local Cache Runner Image

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the run-specific image tag and registry build cache
        type: boolean
        default: false
        required: true

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

concurrency:
  group: runner-image-local-cache-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  CACHE_IMAGE: ghcr.io/${{ github.repository_owner }}/actions-runner-local-cache
  CACHE_TAG: sha-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-amd64
  DOCKER_BUILD_RECORD_UPLOAD: 'false'

jobs:
  build:
    # arm64 must pass its own compatibility gate before it is added here.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
        with:
          cache-binary: false
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build the verified cache-capable variant
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: images/actions-runner
          platforms: linux/amd64
          build-args: |
            RUNNER_BASE_IMAGE=ghcr.io/falcondev-oss/actions-runner@sha256:462ebdbc95fabf0bdf264ffe02ff5182665c6d99ac0f870b67d7f649c1ef1746
            LOCAL_ACTIONS_CACHE=1
          push: ${{ inputs.publish == true }}
          tags: ${{ env.CACHE_IMAGE }}:${{ env.CACHE_TAG }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            io.runscaler.local-actions-cache.protocol=v2
            io.runscaler.local-actions-cache.runner-source=3efdc9c0d8a5b7a441cba3069b0fdc33d1931adb
          provenance: mode=max
          # This image-construction workflow is GitHub-hosted. Its registry
          # build cache is separate from all host-local job caches and from
          # the standard runner image's architecture-specific build caches.
          cache-from: type=registry,ref=${{ env.CACHE_IMAGE }}:buildcache-amd64
          cache-to: ${{ inputs.publish == true && format('type=registry,ref={0}:buildcache-amd64,mode=max', env.CACHE_IMAGE) || '' }}
      - name: Attest the published immutable image digest
        if: inputs.publish == true
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-name: ${{ env.CACHE_IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - name: Record result
        env:
          PUBLISH: ${{ inputs.publish == true }}
          IMAGE: ${{ env.CACHE_IMAGE }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          if [ "$PUBLISH" = true ]; then
            printf 'Verified local-cache image: `%s@%s`\n' "$IMAGE" "$DIGEST" >> "$GITHUB_STEP_SUMMARY"
          else
            printf 'Validated the Linux amd64 image build. Image and registry-cache publication were disabled.\n' >> "$GITHUB_STEP_SUMMARY"
          fi
