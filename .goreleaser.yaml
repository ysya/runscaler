version: 2

builds:
  # The `runner` binary, shipped as runner-* archives.
  - id: runner
    main: ./cmd/runner
    binary: runner
    # Keep release binaries independent of the C compiler's CPU baseline.
    # GOAMD64=v1 does not constrain cgo, which can otherwise emit AVX.
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.ShortCommit}}
      - -X main.date={{.Date}}
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64

archives:
  # runner-{os}-{arch}.tar.gz containing the `runner` binary — what
  # self-update (internal/versioncheck) fetches.
  - id: runner
    ids:
      - runner
    formats:
      - tar.gz
    name_template: "runner-{{ .Os }}-{{ .Arch }}"

checksum:
  name_template: "checksums.txt"

release:
  footer: |
    ## Upgrade and compatibility

    Before restarting a service, review the [upgrade requirements](https://github.com/ysya/runscaler/blob/{{ .Tag }}/README.md#upgrade-requirements) and validate its configuration with the new binary.

    **Upgrading from v0.24.0 or earlier**

    Remove `docker.cache-volumes`, `[[docker.cache]]`, and their per-scale-set forms, including empty overrides. For the enabled native receiver, remove the matching `docker.actions-cache-url` and set `native-actions-cache = true`. A distinct external receiver URL and `shared-volume` are still supported. See the [cache migration and rollback steps](https://github.com/ysya/runscaler/blob/{{ .Tag }}/docs/caching.md#migration-to-actions-cache) before switching workflows. Existing Docker volumes are preserved.
