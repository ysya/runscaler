version: 2

builds:
  # The `runner` binary, shipped as runner-* archives.
  - id: runner
    main: ./cmd/runner
    binary: runner
    # Keep release binaries independent of the C compiler's CPU baseline.
    # GOAMD64=v1 does not constrain cgo, which can otherwise emit AVX.
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.ShortCommit}}
      - -X main.date={{.Date}}
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64

archives:
  # runner-{os}-{arch}.tar.gz containing the `runner` binary — what
  # self-update (internal/versioncheck) fetches.
  - id: runner
    ids:
      - runner
    formats:
      - tar.gz
    name_template: "runner-{{ .Os }}-{{ .Arch }}"

checksum:
  name_template: "checksums.txt"

release:
  footer: |
    ## Upgrade and compatibility

    Before restarting a service, review the [upgrade requirements](https://github.com/ysya/runscaler/blob/{{ .Tag }}/README.md#upgrade-requirements) and validate its configuration with the new binary. The upgrade requirements include current sunset notices and any settings removed by breaking releases.
