# runner configuration
# Copy this file to config.toml and edit as needed.

# --- Global settings ---

log-level = "info"
log-format = "text"
health-address = "127.0.0.1"              # set 0.0.0.0 explicitly for remote monitoring
health-port = 8080
# log-file = "/var/log/runner/runner.log" # default: runner.log beside this config; "" disables

# --- Defaults (inherited by all scale sets unless overridden) ---
# A key set in a [[scaleset]] always wins, even with a zero/empty value:
# e.g. `memory = 0` (unlimited) or `shared-volume = ""` override the default.

# Backend: "docker" (Linux containers) or "tart" (macOS VMs)
backend = "docker"

# Default runner image and group
runner-image = "ghcr.io/actions/actions-runner:latest"
runner-group = "default"
max-runners = 10

# disable-update = true   # bar GitHub from updating the runner binary in the
#                         # image/VM (default). Set false when the image's
#                         # bundled runner can't be refreshed easily — GitHub
#                         # retires old runner versions, and one that may not
#                         # update is refused and exits, leaving jobs queued.

# --- Single scale set mode ---
# Use top-level fields when managing a single org/repo.
# These are ignored when [[scaleset]] entries exist.
#
# Placed here, before [disk]/[docker]/[tart] below, on purpose: TOML has no
# way to "close" a table other than opening the next one, so bare keys like
# these must never directly follow an active table — see the note above
# [[docker.cache]] for the same rule applied inside [docker].

# url = "https://github.com/your-org"
# name = "my-runners"
# token = "ghp_xxx"
# max-runners = 10
# min-runners = 0
# labels = ["self-hosted", "linux"]

# --- Disk guard ---
# Host-wide: watches every scale set's stores grouped by filesystem, not
# part of any one scale set. Reclaims space only under real pressure — see
# README's Caching section for the three-layer model this fits into
# (guard / each store's own retention settings / `runner cache` visibility).
# All values below are the defaults; uncomment only what you want to change.

# [disk]
# guard = true         # reclaim under disk pressure; set false if this host's disk isn't runner's to manage
# min-free = "10%"     # free-space floor that triggers reclamation: a percentage of the filesystem, or a size like "20GB"
# target-free = "20%"  # free-space level reclamation aims to restore before stopping; must be greater than min-free
# interval = "1h"      # how often the periodic check runs
# max-tier = 3         # highest reclaim tier allowed (1-4); tier 4 wipes cache volumes, so it needs explicit opt-in

[docker]
socket = "/var/run/docker.sock"
dind = true
# shared-volume = "/shared"
# shared-volume-name = "runner-shared"     # named volume backing shared-volume; distinct names isolate scalesets (or two runner processes)
# memory = 0     # MB, 0 = unlimited (e.g. 8192 for 8GB)
# cpu = 0        # cores, 0 = unlimited (e.g. 4)
# pids-limit = 0 # max pids (processes + threads) per container; 0 = unlimited (e.g. 4096 to stop fork bombs)
# network = ""   # pre-existing docker network to attach runners to; "" = default bridge (e.g. one created with icc disabled)
# cache-volumes = [                        # named volumes mounted at tool cache paths; persistent, never TTL-swept
#   "gradle-cache:/home/runner/.gradle",
#   "pnpm-store:/home/runner/.local/share/pnpm/store",
# ]
# shared-volume-max-age = "168h"           # delete shared-volume files older than this; 0 = disabled
# shared-volume-cleanup-interval = "6h"    # how often to run the cleanup sweep
# buildx-cleanup = true                    # daemon-wide; opt in only when dedicated to runners
# buildx-cleanup-ttl = "24h"
# buildx-cleanup-interval = "6h"
# prune = true                             # daemon-wide; opt in only when dedicated to runners
# prune-interval = "6h"                    # how often the runtime prune sweep runs
# prune-ttl = "24h"                        # remove stopped containers and dangling images older than this
# build-cache-max-age = "168h"             # prune build cache entries not used within this window
# build-cache-budget = 0                   # cap daemon build cache to N GB (LRU-evicted down to the cap); 0 = no cap

# Long form of cache-volumes, for an entry that needs a retention budget. A
# name also listed in cache-volumes above is replaced entirely by its
# [[docker.cache]] entry, not merged field by field. Keep this the LAST
# [docker] entry in the file: TOML has no way to "close" a table other than
# opening the next one, so every bare key below an array-of-tables header
# belongs to that array entry, not back to [docker] — see [tart] right
# after this for where the table actually ends.
# [[docker.cache]]
# name = "ccache"
# path = "/home/runner/.ccache"
# budget = "20GB"                          # absolute size only (no percentages); enforced independently of disk pressure
# on-exceed = "warn"                       # warn (default: log only, leave data for the tool's own LRU) | wipe (delete everything)

# [tart]
# runner-dir = "/Users/admin/actions-runner"
# cpu = 0        # 0 = use image default
# memory = 0     # MB, 0 = use image default
# pool-size = 0  # pre-warmed VMs, 0 = disabled
# home = "/Users/admin/.tart"             # TART_HOME for tart CLI ("" = ~/.tart)
# cache-budget = 0                        # cap OCI/IPSW cache size in GB; 0 = disabled
# cache-cleanup-interval = "24h"          # how often to run `tart prune --space-budget`

# --- Multiple scale sets mode ---
# Use [[scaleset]] entries to manage multiple orgs/repos from one process.
# Each entry inherits runner-image, runner-group, max-runners, [docker],
# and [tart] from the defaults above unless explicitly overridden.
# Identity fields (url, name, token, labels, min-runners) are per-scaleset
# and never inherited from the top level.
# Unknown keys warn at startup and fail `runner validate`.

# [[scaleset]]
# url = "https://github.com/org-a"
# name = "runners-a"
# token = "ghp_aaa"
# max-runners = 5

# [[scaleset]]
# url = "https://github.com/org-b"
# name = "runners-b"
# token = "ghp_bbb"
# runner-image = "custom-runner:latest"
# labels = ["linux", "gpu"]

# [[scaleset]]
# url = "https://github.com/org-c"
# name = "macos-runners"
# token = "env:TOKEN_ORG_C"
# backend = "tart"
# max-runners = 2
# runner-image = "ghcr.io/cirruslabs/macos-sequoia-xcode:latest"
