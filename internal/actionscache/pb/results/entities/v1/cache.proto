syntax = "proto3";

package github.actions.results.entities.v1;

option go_package = "github.com/ysya/runscaler/internal/actionscache/pb/results/entities/v1;entitypb";

message CacheScope {
  string scope = 1;
  int64 permission = 2;
}

message CacheMetadata {
  int64 repository_id = 1;
  repeated CacheScope scope = 2;
}
