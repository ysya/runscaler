# runner configuration
url = "https://github.com/example-org"
name = "example-runners"
github-app.client-id = "Iv1.example"
github-app.installation-id = 123
github-app.private-key-file = "/etc/runner/app.pem"
max-runners = 10
log-level = "info"
log-format = "text"
health-port = 8080
provider = "docker"
runner-image = "ghcr.io/actions/actions-runner:latest"

[docker]
dind = true
